<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- 关键：让 iPad Safari 全屏、隐藏地址栏、禁缩放 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="花宠乐园" />
  <meta name="theme-color" content="#ffb6c1" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" href="icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <title>花宠乐园</title>
  <script>
  // 自愈看门狗：若页面加载后主内容区仍为空（被损坏/残留的 Service Worker 服务成白屏），
  // 自动注销所有 SW 并强制刷新一次，从脏状态自我恢复，无需手动清除缓存。
  (function () {
    function heal() {
      var v = document.getElementById('view');
      if (v && v.innerHTML.trim().length > 120) return; // 已正常渲染，无需处理
      try { if (sessionStorage.getItem('hw_healed')) return; sessionStorage.setItem('hw_healed', '1'); } catch (e) {}
      var reload = function () { location.reload(true); };
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          Promise.all(regs.map(function (r) { return r.unregister(); })).then(reload).catch(reload);
        }).catch(reload);
      } else { reload(); }
    }
    if (document.readyState === 'complete') setTimeout(heal, 2500);
    else window.addEventListener('load', function () { setTimeout(heal, 2500); });
  })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">潘锂译 · 花宠乐园</div>
    <div class="header-right">
      <div class="life-box">
        <span class="heart">❤️</span>
        <span id="lifePoints">0</span>
      </div>
      <button class="icon-btn" id="helpBtn" title="使用帮助">❓</button>
      <button class="icon-btn" id="gearBtn" title="家长设置">⚙️</button>
    </div>
  </header>

  <div id="restBanner" class="rest-banner hidden"></div>

  <main id="view"><!-- 各标签页内容由 JS 渲染 --></main>

  <nav class="tabs">
    <button class="tab" data-tab="homework"><span>📚</span>作业打卡</button>
    <button class="tab" data-tab="shop"><span>🛒</span>商店</button>
    <button class="tab" data-tab="garden"><span>🌷</span>我的花园</button>
    <button class="tab" data-tab="pet"><span>🐾</span>我的宠物</button>
  </nav>

  <div id="toast" class="toast"></div>
  <div id="modalMask" class="modal-mask hidden">
    <div id="modalBox" class="modal-box"></div>
  </div>

  <script src="passwords.js"></script>
  <script src="app.js"></script>
</body>
</html>
